---
layout: default
---
<article class="post teaching-page">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>

<style>

.teaching-page .card-intro {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: #4b5563;
    margin-top: 0;
    margin-bottom: 1rem;
}

/* Scoped styles specifically for the teaching page */
.teaching-page .teaching-list li {
    padding: 0.75rem 0;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.teaching-page .teaching-list li:last-child {
    border-bottom: none;
}

.teaching-page .course-title {
    font-weight: 600;
    font-size: 1.05rem;
    color: #1f2937;
}

.teaching-page .course-role {
    font-size: 0.9rem;
    color: #2563eb;
    font-weight: 500;
}

.teaching-page .course-details {
    font-size: 0.85rem;
    color: #4b5563;
}

.teaching-page .course-date {
    display: inline-block;
    background-color: #e0f2fe;
    color: #0369a1;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 9999px;
    margin-left: 0.5rem;
}

/* Optional wrapper to align the title and date nicely on the same line */
.teaching-page .course-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
}

/* Additional styles for institution and scientific area */
.teaching-page .course-meta-row {
    display: flex;
    gap: 1rem;
    font-size: 0.9rem;
    color: #4b5563;
    flex-wrap: wrap;
    margin-top: 0.1rem;
}

.teaching-page .course-institution {
    font-weight: 500;
    color: #2563eb;
}

.teaching-page .course-field {
    font-style: italic;
    color: #6b7280;
}

</style>
